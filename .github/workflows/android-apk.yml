name: Build ALONE VPN APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: alone-vpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (Xray + sing-box)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build utilities and NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq unzip zip
          sdkmanager --install 'platform-tools' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          flutter --version
          java -version
          go version

      - name: Generate Android project
        run: flutter create .

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Patch Android manifest and Gradle for VPN services
        run: python3 scripts/patch_android_for_vpn.py

      - name: Patch Android permission cancellation handling
        run: python3 scripts/patch_v2ray_box_android.py

      - name: Patch Android to receive links, shared text and files from other apps
        run: python3 scripts/patch_incoming_intents.py

      - name: Prepare release signing key
        env:
          KS_B64: ${{ secrets.ALONE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.ALONE_STORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alone.p12"
            echo "ALONE_KEYSTORE=$RUNNER_TEMP/alone.p12" >> "$GITHUB_ENV"
            echo "ALONE_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
            ALONE_KEYSTORE="$RUNNER_TEMP/alone.p12" python3 scripts/patch_release_signing.py
          else
            echo "No signing secrets: release will use the default debug signature."
          fi

      - name: Locate and prepare native engine build scripts
        shell: bash
        run: |
          set -euo pipefail
          xray_script="$(find "$HOME/.pub-cache" -type f -path '*/example/scripts/build_android_libxray.sh' -print -quit 2>/dev/null || true)"
          singbox_script="$(find "$HOME/.pub-cache" -type f -path '*/example/scripts/build_android_libsingbox.sh' -print -quit 2>/dev/null || true)"
          test -n "$xray_script" || { echo 'Could not locate the pinned v2ray_box Xray build script.'; exit 1; }
          test -n "$singbox_script" || { echo 'Could not locate the pinned v2ray_box sing-box build script.'; exit 1; }
          mkdir -p scripts
          cp "$xray_script" scripts/build_android_libxray.sh
          # libXray is pinned to v26.1.23: the v2ray_box plugin's Kotlin bridge targets that
          # per-function API (RunXrayFromJSON, GetXrayState, ...). Newer libXray releases
          # replaced it with a single Invoke(json) entry point and break compilation.
          cp "$singbox_script" scripts/build_android_libsingbox.sh
          chmod +x scripts/build_android_libxray.sh scripts/build_android_libsingbox.sh

      - name: Use Go 1.25.6 for libXray (its gVisor dependency breaks on newer Go)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false

      - name: Build Xray native library
        env:
          GOTOOLCHAIN: local
        run: |
          set +e
          {
            go version
            # libXray's build script runs `go get golang.org/x/mobile` (latest), which needs Go >= 1.26
            # and makes Go switch toolchains; the Jan-2026 gVisor pinned by libXray v26.1.23 does not
            # compile on Go 1.26. Pin x/mobile to a Jan-2026 commit (needs only Go 1.24).
            set -e
            LIBXRAY_DIR="$RUNNER_TEMP/libXray"
            git clone --depth 1 --branch v26.1.23 https://github.com/XTLS/libXray.git "$LIBXRAY_DIR"
            sed -i 's#golang.org/x/mobile/cmd/gomobile@latest#golang.org/x/mobile/cmd/gomobile@40bd9ace6ce4#' "$LIBXRAY_DIR/build/app/build.py"
            sed -i 's#\["go", "get", "golang.org/x/mobile/cmd/gomobile"\]#["go", "get", "golang.org/x/mobile@40bd9ace6ce4"]#' "$LIBXRAY_DIR/build/app/build.py"
            grep -n "40bd9ace6ce4" "$LIBXRAY_DIR/build/app/build.py"
            test "$(grep -c 40bd9ace6ce4 "$LIBXRAY_DIR/build/app/build.py")" -eq 2
            # `gomobile init` runs `go install gobind@latest` (needs Go 1.26): install both tools pinned and skip it.
            go install golang.org/x/mobile/cmd/gomobile@40bd9ace6ce4
            go install golang.org/x/mobile/cmd/gobind@40bd9ace6ce4
            export PATH="$(go env GOPATH)/bin:$PATH"
            sed -i 's#\["gomobile", "init"\]#["gomobile", "version"]#' "$LIBXRAY_DIR/build/app/build.py"
            grep -n '"gomobile", "version"' "$LIBXRAY_DIR/build/app/build.py"
            # `go get google.golang.org/genproto` (latest) also needs Go 1.26; libXray's go.mod already pins one.
            sed -i 's#\["go", "get", "google.golang.org/genproto"\]#["go", "get", "golang.org/x/mobile@40bd9ace6ce4"]#' "$LIBXRAY_DIR/build/app/build.py"
            ! grep -q 'google.golang.org/genproto"' "$LIBXRAY_DIR/build/app/build.py"
            bash scripts/build_android_libxray.sh --project-root "$(pwd)" --libxray-dir "$LIBXRAY_DIR" --android-abis arm64-v8a,x86_64
          } 2>&1 | tee /tmp/xray.txt
          exit ${PIPESTATUS[0]}

      - name: Publish Xray build log to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=${GITHUB_SHA::7}
          [ -f /tmp/xray.txt ] || exit 0
          tail -c 300000 /tmp/xray.txt > /tmp/xray_tail.txt
          path="ci-logs/${sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-xray_tail.txt"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message="ci: xray_tail ${sha}" -f branch=ci-logs \
            -f content="$(base64 -w0 /tmp/xray_tail.txt)" > /dev/null || echo "could not publish $path"

      - name: Use newest Go for sing-box
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build sing-box native library
        run: bash scripts/build_android_libsingbox.sh --project-root "$(pwd)" --singbox-ref v1.14.3 --android-abis arm64-v8a,x86_64

      - name: Build release APK
        id: build_apk
        run: |
          set +e
          # --no-shrink: the Xray/sing-box bridges use reflection, so R8 must not strip them
          flutter build apk --release --no-shrink --target-platform android-arm64 -v 2>&1 | tee /tmp/build.txt
          exit ${PIPESTATUS[0]}

      - name: Publish build log to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=${GITHUB_SHA::7}
          [ -f /tmp/build.txt ] || exit 0
          # keep the interesting end of a very long verbose log (GitHub API limit ~1MB)
          tail -c 700000 /tmp/build.txt > /tmp/build_tail.txt
          grep -nE "FAILURE:|What went wrong|error:|Error:|e: |Execution failed|Could not|AAPT|Manifest merger|> Task .* FAILED" /tmp/build.txt | tail -60 > /tmp/build_errors.txt || true
          for f in build_errors build_tail; do
            path="ci-logs/${sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${f}.txt"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="ci: ${f} ${sha}" -f branch=ci-logs \
              -f content="$(base64 -w0 /tmp/${f}.txt)" > /dev/null || echo "could not publish $path"
          done

      - name: Build x86_64 test APKs for the emulator job
        id: build_x64
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/apks
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/alone-arm64.apk
          flutter build apk --release --no-shrink --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apks/alone-x64.apk
          flutter build apk --release --no-shrink --target-platform android-x64 \
            --dart-define=ALONE_SELFTEST_LINK='ss://YWVzLTI1Ni1nY206Y2l0ZXN0cGFzcw==@10.0.2.2:18388#CI-Test'
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apks/alone-x64-selftest.apk
          # put the real arm64 APK back where the upload step expects it
          cp /tmp/alone-arm64.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload emulator test APKs
        if: steps.build_x64.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: alone-test-apks
          path: /tmp/apks
          retention-days: 3

      # Validation is run after APK creation so an analysis/test issue does not
      # prevent the already-built installable APK from being uploaded below.
      - name: Analyze Dart code
        if: always() && steps.build_apk.outcome == 'success'
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        timeout-minutes: 12
        if: always() && steps.build_apk.outcome == 'success'
        continue-on-error: true
        run: flutter test --no-pub

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="ALONE-VPN-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "ALONE VPN ${TAG} (beta)" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alone-vpn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

  emulator-test:
    name: Emulator end-to-end test (install, launch, connect VPN)
    needs: build-android
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download test APKs
        uses: actions/download-artifact@v4
        with:
          name: alone-test-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start a local Xray server (plays the VPN server)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/xr
          gh release download --repo XTLS/Xray-core --pattern 'Xray-linux-64.zip' --dir /tmp/xr
          unzip -o /tmp/xr/Xray-linux-64.zip -d /tmp/xr
          cat > /tmp/xr/config.json <<'JSON'
          {
            "log": { "loglevel": "info", "access": "/tmp/xray-access.log" },
            "inbounds": [{
              "listen": "0.0.0.0", "port": 18388, "protocol": "shadowsocks",
              "settings": { "method": "aes-256-gcm", "password": "citestpass", "network": "tcp,udp" }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          JSON
          : > /tmp/xray-access.log
          nohup /tmp/xr/xray run -c /tmp/xr/config.json > /tmp/xray-stdout.log 2>&1 &
          sleep 3
          ss -ltn | grep 18388 && echo "xray server is listening"

      - name: Run the app on an Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/emulator_test.sh

      - name: Publish report and screenshots to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow || true
          tail -n 200 /tmp/xray-access.log > /tmp/emu/xray_access_tail.txt 2>/dev/null || true
          python3 scripts/publish_ci_files.py "emu-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            /tmp/emu/report.txt /tmp/emu/logcat_filtered.txt /tmp/emu/flutter_startup.txt /tmp/emu/xray_access_tail.txt /tmp/emu/shots/*.png

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: /tmp/emu
          retention-days: 7

  ovpn-e2e:
    name: OpenVPN end-to-end (profile import, OpenVPN for Android hand-off)
    needs: build-android
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download test APKs
        uses: actions/download-artifact@v4
        with:
          name: alone-test-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start a real OpenVPN server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          bash scripts/ovpn_server_setup.sh

      - name: Run the OpenVPN scenario on an Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ovpn_e2e.sh

      - name: Publish OpenVPN results to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow || true
          sudo tail -n 150 /tmp/ovpn/server.log > /tmp/ovpn_e2e/server_log_tail.txt 2>/dev/null || true
          python3 scripts/publish_ci_files.py "ovpn-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" \
            /tmp/ovpn_e2e/report.txt /tmp/ovpn_e2e/logcat_openvpn.txt /tmp/ovpn_e2e/server_log_tail.txt /tmp/ovpn_e2e/shots/*.png
